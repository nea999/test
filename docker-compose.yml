networks:
  internal:

services:
  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spring-app:latest
    container_name: spring-app
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      SPRING_PROFILES_ACTIVE: "default"
    networks:
      - internal
    restart: unless-stopped